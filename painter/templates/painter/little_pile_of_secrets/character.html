{% load static %}

<header>
    <h3>{{ name }}</h3>
    <p>{{ c.subtitle }}</p>
</header>

<div class="portrait block">
    <img src="{% static 'images/little_pile_of_secrets/' %}{{ c.portrait }}" />
</div>

<div class="bio block">
    <p>{{ c.bio | safe }}</p>
</div>

{% if c.roleplaying_hint %}
    <div class="roleplaying-hint block">
        <h5>Roleplaying hint</h5>
        <p>{{ c.roleplaying_hint | safe }}</p>
    </div>
{% endif %}
